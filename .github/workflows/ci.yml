name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install a C compiler for the c backend
        run: sudo apt-get update && sudo apt-get install -y gcc

      # The release assets are named paykanlang-<version>-linux-x86_64.tar.gz
      # and unpack to paykanlang/bin/paykan (checked against v0.1.1).
      - name: Download the latest PaykanLang release
        run: |
          set -euo pipefail
          url=$(curl -sSL -H "Accept: application/vnd.github+json" \
                  https://api.github.com/repos/parsabee/PaykanLang/releases/latest \
                | python3 -c 'import json,sys; a=[x["browser_download_url"] for x in json.load(sys.stdin)["assets"] if x["name"].endswith("-linux-x86_64.tar.gz")]; print(a[0])')
          echo "downloading $url"
          mkdir -p .paykan
          curl -sSL "$url" | tar xz -C .paykan
          echo "$PWD/.paykan/paykanlang/bin" >> "$GITHUB_PATH"

      - name: Show the compiler
        run: paykan --version && paykan --list-backends

      - name: Run the tests on every backend
        run: python3 scripts/run_tests.py
